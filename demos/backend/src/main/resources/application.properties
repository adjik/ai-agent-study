spring.application.name=ai-agent-demos

# \u7EDF\u4E00\u540E\u7AEF\u7AEF\u53E3\uFF0C\u4E0E demos/frontend/demos.config.ts \u4FDD\u6301\u4E00\u81F4
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DeepSeek \u8FDC\u7A0B API\uFF08OpenAI \u517C\u5BB9\u683C\u5F0F\uFF09
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.model=deepseek-v4-flash
# \u5B98\u65B9 OpenAI Java SDK \u9ED8\u8BA4 60s\uFF1B/role \u4F1A\u8FDE\u8C03\u4E24\u6B21\uFF0C\u5206\u6790\u7C7B\u5DE5\u5355\u5BB9\u6613\u8D85\u8FC7 60s
spring.ai.openai.timeout=180s
spring.ai.openai.chat.max-tokens=20480
